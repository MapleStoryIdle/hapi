# Add these locations before the catch-all `location /` for the existing SHAPI host.
# The Nginx worker also needs traverse permission on /opt/hapi and read permission
# on /opt/hapi/downloads (for example: chmod 751 /opt/hapi). Runner binaries are
# hosted by GitHub Releases; this host only serves the installer and metadata.
location = /install.sh {
    alias /opt/hapi/downloads/install.sh;
    default_type text/x-shellscript;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /downloads/runner/latest.json {
    alias /opt/hapi/downloads/runner/latest.json;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ ^/downloads/runner/([0-9]+\.[0-9]+\.[0-9]+)/(hapi-(darwin|linux)-(arm64|x64)(-baseline)?\.tar\.gz|checksums\.txt)$ {
    return 302 https://github.com/MapleStoryIdle/hapi/releases/download/runner-v$1/$2;
}

location /downloads/runner/ {
    return 404;
}
