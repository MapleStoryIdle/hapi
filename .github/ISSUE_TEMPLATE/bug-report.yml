name: Bug Report
description: Report an issue that should be fixed
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting a bug report! It helps make SHAPI better for everyone.

        If you need help or support using SHAPI, and are not reporting a bug, please post in [SHAPI Discussions](https://github.com/MapleStoryIdle/shapi/discussions), where you can ask questions or engage with others on ideas for how to improve SHAPI.

        You are already an engineer who uses coding agents; you should know how to describe issues clearly. Issues that lack a clear description will be closed.

        Please try to include as much information as possible.

        Never include credentials, pairing codes, private keys, private repository content, session transcripts, or production logs. Report security issues through [private vulnerability reporting](https://github.com/MapleStoryIdle/shapi/security/advisories/new), not this form.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, pairing codes, private URLs, personal data, and private workspace content from this report.
          required: true

  - type: input
    id: version
    attributes:
      label: What version of SHAPI is running?
      description: Copy the output of `shapi --version` (`hapi --version` is the compatibility alias)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: What platform is your computer?
      description: |
        For MacOS and Linux: copy the output of `uname -mprs`
        For Windows: copy the output of `"$([Environment]::OSVersion | ForEach-Object VersionString) $(if ([Environment]::Is64BitOperatingSystem) { "x64" } else { "x86" })"` in the PowerShell console
  - type: textarea
    id: actual
    attributes:
      label: What issue are you seeing?
      description: Include only the relevant error text with sensitive values redacted. Prefer redacted text over screenshots.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What steps can reproduce the bug?
      description: Explain the bug and provide a minimal, sanitized example. Include token-limit or context-window usage only when relevant; do not include session IDs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is the expected behavior?
      description: If possible, please provide text instead of a screenshot.
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Is there anything else you think we should know?
