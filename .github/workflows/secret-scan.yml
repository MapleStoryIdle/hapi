name: Secret scan

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tracked-files:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Scan repository files
              run: >-
                  docker run --rm
                  --volume "$GITHUB_WORKSPACE:/repo:ro"
                  ghcr.io/gitleaks/gitleaks:v8.30.1
                  dir --no-banner --redact /repo
