name: Deploy Web App to GitHub Pages

on:
    push:
        branches:
            - main
        paths:
            - 'web/**'
            - '.github/workflows/webapp.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            - name: Configure Pages base path
              env:
                  SHAPI_PAGES_DOMAIN: ${{ vars.SHAPI_PAGES_DOMAIN }}
              run: |
                  if [ -n "$SHAPI_PAGES_DOMAIN" ]; then
                    echo "VITE_BASE_URL=/" >> "$GITHUB_ENV"
                  else
                    echo "VITE_BASE_URL=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
                  fi
            - name: Build web app
              env:
                  VITE_REQUIRE_HUB_URL: '1'
              run: bun run --cwd web build
            - name: Add CNAME for custom domain
              if: ${{ vars.SHAPI_PAGES_DOMAIN != '' }}
              env:
                  SHAPI_PAGES_DOMAIN: ${{ vars.SHAPI_PAGES_DOMAIN }}
              run: printf '%s\n' "$SHAPI_PAGES_DOMAIN" > web/dist/CNAME
            - name: Setup Pages
              uses: actions/configure-pages@v5
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: web/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
